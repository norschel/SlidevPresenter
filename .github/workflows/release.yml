name: Package desktop release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  VELOPACK_VERSION: '1.2.161'
  APP_PROJECT: src/SlideDevPresenter.App/SlideDevPresenter.App.csproj

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate stable release tag
        id: version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must be vMAJOR.MINOR.PATCH (no prerelease suffix)."
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - run: dotnet restore SlideDevPresenter.sln
      - run: dotnet build SlideDevPresenter.sln --configuration Release --no-restore
      - run: dotnet test SlideDevPresenter.sln --configuration Release --no-build

  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
            executable: SlideDevPresenter.App.exe
          - runner: macos-15
            rid: osx-x64
            executable: SlideDevPresenter.App
          - runner: macos-15
            rid: osx-arm64
            executable: SlideDevPresenter.App
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install packaging tool
        run: dotnet tool install --global vpk --version ${{ env.VELOPACK_VERSION }}
      - name: Publish self-contained application
        shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          RID: ${{ matrix.rid }}
        run: |
          dotnet publish $env:APP_PROJECT --configuration Release --runtime $env:RID --self-contained true `
            -p:Version=$env:VERSION -p:PublishSingleFile=false -p:PublishTrimmed=false --output publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate macOS application icon
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/app.iconset"
          sips -s format png src/SlideDevPresenter.App/Assets/appicon.ico --out "$RUNNER_TEMP/app.png"
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" "$RUNNER_TEMP/app.png" --out "$RUNNER_TEMP/app.iconset/icon_${size}x${size}.png"
            double=$((size * 2))
            sips -z "$double" "$double" "$RUNNER_TEMP/app.png" --out "$RUNNER_TEMP/app.iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns "$RUNNER_TEMP/app.iconset" -o "$RUNNER_TEMP/app.icns"
      - name: Configure optional macOS signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.MACOS_APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          if [[ -z "$CERTIFICATE" ]]; then
            echo "No macOS certificate configured; creating unsigned packages."
            exit 0
          fi
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_key=$(uuidgen)
          echo "::add-mask::$keychain_key"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security list-keychains -d user | sed 's/^[[:space:]]*"//; s/"[[:space:]]*$//' > "$RUNNER_TEMP/original-keychains"
          security create-keychain -p "$keychain_key" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_key" "$keychain"
          keychains=()
          while IFS= read -r existing; do
            keychains+=("$existing")
          done < "$RUNNER_TEMP/original-keychains"
          security list-keychains -d user -s "$keychain" "${keychains[@]}"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_key" "$keychain"
          xcrun notarytool store-credentials release-notary --keychain "$keychain" \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APPLE_PASSWORD"
          echo "MACOS_SIGNING_ENABLED=true" >> "$GITHUB_ENV"
      - name: Package application
        shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          RID: ${{ matrix.rid }}
          MAIN_EXE: ${{ matrix.executable }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          MACOS_APP_IDENTITY: ${{ secrets.MACOS_SIGN_APP_IDENTITY }}
          MACOS_INSTALL_IDENTITY: ${{ secrets.MACOS_SIGN_INSTALL_IDENTITY }}
        run: |
          $arguments = @(
            "pack", "--packId", "SlideDevPresenter", "--packVersion", $env:VERSION,
            "--packDir", "publish", "--mainExe", $env:MAIN_EXE,
            "--packTitle", "SlideDevPresenter", "--runtime", $env:RID,
            "--channel", $env:RID, "--outputDir", "Releases", "--delta", "None"
          )
          if ($IsWindows) {
            $arguments += @("--icon", "src/SlideDevPresenter.App/Assets/appicon.ico", "--framework", "webview2")
            if ($env:WINDOWS_CERTIFICATE) {
              $certificatePath = Join-Path $env:RUNNER_TEMP "signing.pfx"
              [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
              $importOptions = @{
                FilePath = $certificatePath
                CertStoreLocation = "Cert:\CurrentUser\My"
                Password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
              }
              $certificate = Import-PfxCertificate @importOptions
              $arguments += @("--signParams", "/sha1 $($certificate.Thumbprint) /fd SHA256 /tr http://timestamp.digicert.com /td SHA256")
            }
          } else {
            $arguments += @("--bundleId", "com.norschel.slidedevpresenter", "--icon", (Join-Path $env:RUNNER_TEMP "app.icns"))
            if ($env:MACOS_SIGNING_ENABLED -eq "true") {
              if (!$env:MACOS_APP_IDENTITY -or !$env:MACOS_INSTALL_IDENTITY) {
                throw "Both macOS signing identities must be configured."
              }
              $arguments += @(
                "--signAppIdentity", $env:MACOS_APP_IDENTITY, "--signInstallIdentity", $env:MACOS_INSTALL_IDENTITY,
                "--notaryProfile", "release-notary", "--keychain", (Join-Path $env:RUNNER_TEMP "release.keychain-db")
              )
            }
          }
          vpk @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Remove temporary signing credentials
        if: always()
        shell: pwsh
        run: |
          Remove-Item (Join-Path $env:RUNNER_TEMP "signing.p12"), (Join-Path $env:RUNNER_TEMP "signing.pfx") -ErrorAction SilentlyContinue
          if ($IsMacOS) {
            $originalKeychains = Join-Path $env:RUNNER_TEMP "original-keychains"
            if (Test-Path $originalKeychains) {
              $keychains = @(Get-Content $originalKeychains)
              security list-keychains -d user -s @keychains
            }
            if (Test-Path (Join-Path $env:RUNNER_TEMP "release.keychain-db")) {
              security delete-keychain (Join-Path $env:RUNNER_TEMP "release.keychain-db")
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.rid }}
          path: Releases/*
          if-no-files-found: error

  release:
    needs: [verify, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Upload installers and update feeds to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]]; then
              echo "Refusing to overwrite a published release."
              exit 1
            fi
          else
            gh release create "$TAG" --verify-tag --draft --title "SlideDevPresenter $TAG" --generate-notes
          fi
          gh release upload "$TAG" release-assets/* --clobber
